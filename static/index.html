<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Neuro-Architect | Kenneth Lee</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;800&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="logo">✦ Neuro-Architect</div>
        <div class="nav-right">
            <button onclick="toggleDarkMode()" class="theme-switch" id="theme-toggle">🌙</button>
            <div id="g_id_onload" data-client_id="121246915230-hrfas5irqhnb8sgg8qoc37ba51dqkg0g.apps.googleusercontent.com" data-callback="handleCredentialResponse"></div>
            <div class="g_id_signin" data-type="icon" data-shape="circle"></div>
            <span id="user-display" style="display:none; font-weight:700; color:#6366F1; margin-left:10px;"></span>
        </div>
    </nav>

    <main class="container">
        <div class="dashboard-side">
            <section id="focus-area" class="focus-card" style="display: none; background: #6366F1; padding: 30px; border-radius: 25px; color: white; text-align: center; margin-bottom: 20px;">
                <h4 style="font-size: 0.7rem; opacity: 0.8; letter-spacing: 1.5px;">FLOW STATE ACTIVE</h4>
                <p id="session-timer" style="font-size: 4rem; font-weight: 800; margin: 15px 0;">00:00:00</p>
                <div style="display: flex; gap: 10px; justify-content: center;">
                    <button id="btn-pause-resume" onclick="togglePause()" style="background: rgba(255,255,255,0.2); border: none; color: white; padding: 10px 20px; border-radius: 12px; cursor: pointer;">Pause</button>
                    <button onclick="finishSession()" style="background: white; border: none; color: #6366F1; padding: 10px 20px; border-radius: 12px; cursor: pointer; font-weight: 700;">Complete</button>
                </div>
            </section>

            <section class="dashboard">
                <div class="stat-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px;">
                    <div class="stat-card" style="background:white; padding:15px; border-radius:15px; border:1px solid #eee;">
                        <h4 style="font-size:0.7rem; color:#64748B;">STREAK</h4>
                        <p id="streak-count" style="font-size:1.5rem; font-weight:800;">0 Days</p>
                    </div>
                    <div class="stat-card" style="background:white; padding:15px; border-radius:15px; border:1px solid #eee;">
                        <h4 style="font-size:0.7rem; color:#64748B;">CAPITAL</h4>
                        <p id="focus-total" style="font-size:1.5rem; font-weight:800;">0 min</p>
                    </div>
                </div>
                <div class="chart-wrapper" style="height: 220px;"><canvas id="dopamineChart"></canvas></div>
            </section>

            <div class="quick-start-card" style="display:flex; gap:10px; justify-content:center; margin-top:20px;">
                <button onclick="startWorkSession(15)" class="task-btn">15m Sprint</button>
                <button onclick="startWorkSession(25)" class="task-btn">25m Pomodoro</button>
                <button onclick="startWorkSession(50)" class="task-btn">50m Deep Dive</button>
            </div>
        </div>

        <div class="chat-side">
            <div id="chat-box" class="chat-box" style="flex:1; overflow-y:auto; padding: 20px;"></div>
            <div id="task-container" class="task-container" style="display:flex; gap:8px; padding: 10px 20px; flex-wrap: wrap;"></div>
            <div class="input-area" style="padding: 20px;">
                <div class="search-bar" style="display:flex; background:#F1F5F9; border-radius:15px; padding:5px 15px;">
                    <input type="text" id="user-input" placeholder="Update status..." style="flex:1; border:none; background:transparent; padding:10px; outline:none;">
                    <button onclick="sendChat()" style="background:#6366F1; color:white; border:none; border-radius:10px; width:35px; height:35px; cursor:pointer;">↑</button>
                </div>
            </div>
        </div>
    </main>
    <script src="/static/script.js"></script>
</body>
</html>
